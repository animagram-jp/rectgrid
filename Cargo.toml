[package]
name = "rectgrid"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Boundary box operations on rectilinear grids with arbitrary unit systems."
license = "Apache-2.0"
homepage = "https://animagram-jp.github.io/rectgrid/"
repository = "https://github.com/animagram-jp/rectgrid"
readme = "README.md"
keywords = ["layout", "grid", "bbox", "geometry", "no-std"]
categories = ["graphics", "gui", "data-structures", "no-std"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[dependencies]
libm = "0.2"

[features]
default  = []
geometry = []

[lints.rust]
missing_docs           = "deny"
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use        = "deny"

[lints.clippy]
all                             = { level = "deny", priority = -1 }
undocumented_unsafe_blocks      = "forbid"
unnecessary_safety_comment      = "deny"
unnecessary_safety_doc          = "deny"
missing_safety_doc              = "deny"
allow_attributes                = "deny"
allow_attributes_without_reason = "deny"
too_many_arguments              = "allow"
type_complexity                 = "allow"
new_without_default             = "allow"
std_instead_of_core             = "deny"
std_instead_of_alloc            = "deny"
alloc_instead_of_core           = "deny"

[package.metadata.docs.rs]
all-features = true
