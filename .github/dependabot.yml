# .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # .github/workflows/*.yml
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/examples"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      - dependency-name: "spinning_top"
        versions: [">=0.4"]
