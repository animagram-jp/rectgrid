name: "Deploy to GitHub Pages"

on:
    workflow_dispatch:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: "add wasm32 target"
              run: rustup target add wasm32-unknown-unknown

            - name: "install wasm-bindgen-cli"
              run: |
                  version="$(grep -A1 '^name = "wasm-bindgen"$' examples/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
                  cargo install wasm-bindgen-cli --version "$version" --locked

            - name: "cargo test"
              run: cargo test --all-features

            - name: "cargo doc"
              run: cargo doc --all-features --no-deps
              env:
                  RUSTDOCFLAGS: "-D warnings"

            - name: "cargo test (examples)"
              working-directory: "./examples"
              run: cargo test --locked

            - name: "cargo build (wasm32, main thread)"
              working-directory: "./examples"
              run: |
                  RUSTFLAGS="-Clink-arg=--import-memory -Clink-arg=--max-memory=134217728" \
                  cargo build --release --target wasm32-unknown-unknown --locked

            - name: "wasm-bindgen"
              working-directory: "./examples"
              run: |
                  wasm-bindgen --target web --remove-name-section --out-dir app --out-name app \
                    target/wasm32-unknown-unknown/release/app.wasm

            - name: "remove wasm-bindgen package boilerplate (no suppression flag exists)"
              working-directory: "./examples"
              run: rm -f app/README.md app/LICENSE

            - name: "remove build intermediates from Pages artifact"
              working-directory: "./examples"
              run: rm -rf target

            - name: "setup Github Pages"
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: "upload artifact as Github Pages"
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                path: "./examples"

            - name: "deploy to GitHub Pages"
              id: "deployment"
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
