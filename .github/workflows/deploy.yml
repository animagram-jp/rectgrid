name: "Deploy"

on:
    push:
        tags: ["*.*.*"]
    workflow_dispatch:
        inputs:
            github:
                description: "deploy to GitHub Pages"
                type: boolean
                default: true
            crates:
                description: "publish to crates.io"
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: "deploy"
    cancel-in-progress: false

jobs:
    deploy-crates:
        if: github.event_name == 'push' || inputs.crates
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        environment:
            name: "crates-io"
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: "verify tag matches Cargo.toml version"
              run: |
                  version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
                  test "$version" = "${GITHUB_REF_NAME}"

            - name: "crates.io authentication"
              id: "auth"
              uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

            - name: "cargo publish"
              run: cargo publish --all-features
              env:
                  CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

    deploy-github:
        if: github.event_name == 'push' || inputs.github
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: "github-pages"
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: "git checkout"
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: "add wasm32 target"
              run: rustup target add wasm32-unknown-unknown

            - name: "install wasm-bindgen-cli"
              run: |
                  version="$(grep -A1 '^name = "wasm-bindgen"$' examples/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
                  cargo install wasm-bindgen-cli --version "$version" --locked

            - name: "cargo build (wasm32, main thread)"
              working-directory: "./examples"
              run: |
                  RUSTFLAGS="-Clink-arg=--import-memory -Clink-arg=--max-memory=134217728" \
                  cargo build --release --target wasm32-unknown-unknown --locked

            - name: "wasm-bindgen"
              working-directory: "./examples"
              run: |
                  wasm-bindgen --target web --remove-name-section --out-dir app --out-name app \
                    target/wasm32-unknown-unknown/release/app.wasm

            - name: "remove wasm-bindgen package boilerplate (no suppression flag exists)"
              working-directory: "./examples"
              run: rm -f app/README.md app/LICENSE

            - name: "remove build intermediates from Pages artifact"
              working-directory: "./examples"
              run: rm -rf target

            - name: "setup Github Pages"
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: "upload artifact as Github Pages"
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: "./examples"

            - name: "deploy to GitHub Pages"
              id: "deployment"
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
